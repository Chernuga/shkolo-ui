<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shkolo API status</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#0b1220; color:#e6edf7;
           font:15px/1.6 ui-sans-serif, system-ui, sans-serif; }
    .box { background:#121a2b; border:1px solid #1f2a40; border-radius:14px; padding:26px 28px; max-width:460px; }
    .row { display:flex; justify-content:space-between; gap:18px; padding:7px 0; border-bottom:1px solid #1e2940; }
    .row:last-of-type { border-bottom:0; }
    .k { color:#8ea0bb; }
    .ok { color:#4ade80; } .bad { color:#f87171; }
    h1 { font-size:17px; margin:0 0 14px; }
    code { background:#0d1524; border:1px solid #233149; padding:1px 6px; border-radius:5px; }
  </style>
</head>
<body>
<div class="box">
  <h1>Shkolo API · configuration</h1>
  <div class="row"><span class="k">API base</span><span id="api">—</span></div>
  <div class="row"><span class="k">Configured</span><span id="cfg">—</span></div>
  <div class="row"><span class="k">Reachable</span><span id="reach">—</span></div>
  <p id="hint" style="color:#8ea0bb;font-size:13px;margin-bottom:0"></p>
</div>
<script src="/config.js"></script>
<script>
(async () => {
  const base = (window.SHKOLO_API_BASE || '').replace(/\/+$/, '');
  document.getElementById('api').textContent = base || '(empty)';
  document.getElementById('cfg').className = base ? 'ok' : 'bad';
  document.getElementById('cfg').textContent = base ? 'yes' : 'no — set SHKOLO_API_BASE';

  const reach = document.getElementById('reach');
  if (base) {
    try {
      const r = await fetch(base + '/health');
      const j = await r.json();
      reach.className = 'ok';
      reach.textContent = 'yes (' + j.service + ')';
    } catch (e) {
      reach.className = 'bad';
      reach.textContent = 'no';
    }
  } else {
    reach.textContent = 'skipped';
  }

  document.getElementById('hint').innerHTML =
    'Set <code>SHKOLO_API_BASE</code> in Pages → Settings → Environment variables, e.g. ' +
    '<code>https://shkolo-api.&lt;subdomain&gt;.workers.dev</code>';
})();
</script>
</body>
</html>
