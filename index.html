<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дневник · Shkolo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="styles.css?v=3">
</head>
<body>

<!-- ================= LOGIN ================= -->
<div class="login-screen" id="loginScreen">
  <form class="login-box" id="loginForm" autocomplete="on">
    <div class="login-logo">
      <svg viewBox="0 0 32 32" width="34" height="34" aria-hidden="true">
        <path d="M16 3 3 9v14l13 6 13-6V9L16 3Z" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M10 15h12M10 20h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span>Shkolo</span>
    </div>

    <label for="username">Потребителско име</label>
    <input id="username" name="username" autocomplete="username" spellcheck="false" placeholder="Имейл или потребителско име">

    <label for="password">Парола</label>
    <div class="password-wrap">
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Парола">
      <button type="button" class="eye" id="togglePass" aria-label="Покажи паролата">👁</button>
    </div>

    <button type="submit" class="btn-primary" id="loginBtn">ВХОД</button>
    <p class="login-msg" id="loginMsg">Паролата се изпраща веднъж и не се запазва.</p>
  </form>
</div>

<!-- ================= APP ================= -->
<div class="app hidden" id="app">

  <!-- top bar -->
  <header class="topbar">
    <button class="icon-btn only-mobile" id="menuBtn" aria-label="Меню">☰</button>
    <div class="top-title" id="topTitle">Дневник</div>
    <div class="top-actions">
      <span class="user-chip" id="userChip">—</span>
      <button class="icon-btn" id="logoutBtn" title="Изход">⎋</button>
    </div>
  </header>

  <!-- sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="side-brand">
      <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
        <path d="M16 3 3 9v14l13 6 13-6V9L16 3Z" fill="none" stroke="currentColor" stroke-width="2"/>
      </svg>
      <span>Shkolo</span>
    </div>

    <nav class="side-nav">
      <button class="nav-item active" data-view="grades"><span class="ico">▲</span>Оценки</button>
      <button class="nav-item" data-view="schedule"><span class="ico">▤</span>Програма</button>
      <button class="nav-item" data-view="absences"><span class="ico">◱</span>Отсъствия</button>
      <button class="nav-item" data-view="homeworks"><span class="ico">✎</span>Домашни</button>
      <button class="nav-item" data-view="raw"><span class="ico">⌘</span>Raw</button>
    </nav>

    <div class="side-foot">
      <div class="muted small" id="weekInfo">—</div>
    </div>
  </aside>

  <!-- content -->
  <main class="content" id="content">

    <!-- GRADES -->
    <section class="view" id="view-grades">
      <div class="view-head">
        <h2>Оценки</h2>
        <div class="head-tools">
          <span class="stat" id="gradesStat">—</span>
          <button class="btn-ghost" id="gradesRefresh">Обнови</button>
        </div>
      </div>

      <div class="filterbar">
        <input id="fSubject" placeholder="Предмет…">
        <input id="fMin" placeholder="мин" inputmode="decimal">
        <input id="fMax" placeholder="макс" inputmode="decimal">
        <button class="btn-ghost" id="fApply">Филтър</button>
        <button class="btn-ghost" id="fClear">Изчисти</button>
      </div>

      <div class="card table-card">
        <table class="grades-table" id="gradesTable">
          <thead>
            <tr>
              <th class="num">№</th>
              <th>Предмет</th>
              <th>I срок</th>
              <th>II срок</th>
              <th class="num">Годишна</th>
              <th class="num">Среден</th>
            </tr>
          </thead>
          <tbody id="gradesBody">
            <tr><td colspan="6" class="empty">Зареждане…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- SCHEDULE -->
    <section class="view hidden" id="view-schedule">
      <div class="view-head">
        <h2>Програма</h2>
        <div class="head-tools">
          <button class="btn-ghost" id="weekPrev">‹</button>
          <span class="stat" id="weekLabel">—</span>
          <button class="btn-ghost" id="weekNext">›</button>
          <button class="btn-ghost" id="weekNow">Тази седмица</button>
        </div>
      </div>
      <div class="week-grid" id="weekGrid"></div>
    </section>

    <!-- ABSENCES / HOMEWORKS (raw shkolo pages) -->
    <section class="view hidden" id="view-absences">
      <div class="view-head">
        <h2>Отсъствия</h2>
        <div class="head-tools"><a class="btn-ghost" id="absLink" href="#" target="_blank">Отвори ↗</a></div>
      </div>
      <iframe class="frame" id="absFrame" title="Отсъствия"></iframe>
    </section>

    <section class="view hidden" id="view-homeworks">
      <div class="view-head">
        <h2>Домашни</h2>
        <div class="head-tools"><a class="btn-ghost" id="hwLink" href="#" target="_blank">Отвори ↗</a></div>
      </div>
      <iframe class="frame" id="hwFrame" title="Домашни"></iframe>
    </section>

    <!-- RAW -->
    <section class="view hidden" id="view-raw">
      <div class="view-head"><h2>Raw</h2></div>
      <div class="filterbar">
        <code class="prefix">/raw/</code>
        <input id="rawPath" placeholder="diary/pupil/2600106129" style="flex:1;min-width:220px">
        <button class="btn-ghost" id="rawGo">Отвори</button>
      </div>
      <div class="muted small" id="rawStatus" style="margin:8px 0">Всяка страница на app.shkolo.bg.</div>
      <iframe class="frame" id="rawFrame" title="Raw"></iframe>
    </section>

  </main>
</div>

<div class="toast hidden" id="toast"></div>

<script src="./config.js"></script>
<script src="./app.js?v=3"></script>
</body>
</html>
